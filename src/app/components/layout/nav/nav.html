<nav class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex h-14 items-center justify-between">
            <!-- LINKS -->
            <div class="flex items-center gap-6 text-sm hover:cursor-pointer">
                <!-- MENU -->
                <a routerLink="/menu" class="text-slate-600 hover:text-sky-600 transition-colors pb-0.5">
                    Inicio
                </a>
                <!-- DESPLEGABLE GESTIÓN DE USUARIOS -->
                <div class="relative group">
                    <a class="text-slate-600 hover:text-sky-600 transition-colors pb-0.5 flex items-center gap-1">
                        Gestión de usuarios
                        <svg class="w-4 h-4 transition-transform group-hover:-rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </a>
                    
                    <!-- MENÚ DESPLEGABLE -->
                    <div class="absolute left-0 top-full mt-1 w-56 bg-white border border-slate-200 rounded-xl shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 py-1">
                        <a routerLink="/users-list" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 rounded-t-xl transition-colors">
                            Lista de usuarios
                        </a>
                        <a routerLink="/users-form" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 rounded-b-xl transition-colors">
                            Crear usuario
                        </a>
                    </div>
                </div>
            </div>

            <!-- USER -->
            <div class="flex items-center gap-2">
                @if(username()) {
                    <button class="w-20 h-8 mx-10 text-xs bg-red-400 border-red-500 rounded-full hover:cursor-pointer hover:bg-red-600 transition-all" (click)="logout()">
                        Cerrar sesión
                    </button>
                }
                <span class="text-xl font-semibold text-slate-800">
                    @if(username()) {
                    {{username()}}
                    } @else {
                    Anonimo
                    }
                </span>
                <div
                    class="h-8 w-8 rounded-lg bg-sky-600 flex items-center justify-center text-xs font-bold text-white">
                    @if(username()) {
                    {{username()?.charAt(0)?.toUpperCase()}}
                    } @else {
                    A
                    }
                </div>
            </div>
        </div>
    </div>
</nav>
