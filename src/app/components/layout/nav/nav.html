<nav class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex h-14 items-center justify-between">
            <!-- LINKS -->
            <div class="flex items-center gap-6 text-sm hover:cursor-pointer">
                <a routerLink="/menu" class="text-slate-600 hover:text-sky-600 transition-colors pb-0.5">
                    Inicio
                </a>
                <a routerLink="/users-list" class="text-slate-600 hover:text-sky-600 transition-colors pb-0.5">
                    Gestión de usuarios
                </a>
            </div>

            <!-- USER -->
            <div class="flex items-center gap-2">
                @if(username()) {
                    <button class="w-20 h-8 mx-10 text-xs bg-red-400 border-red-500 rounded-full hover:cursor-pointer hover:bg-red-600 transition-all" (click)="logout()">
                        Cerrar sesión
                    </button>
                }
                <span class="text-xl font-semibold text-slate-800">
                    @if(username()) {
                    {{username()}}
                    } @else {
                    Anonimo
                    }
                </span>
                <div
                    class="h-8 w-8 rounded-lg bg-sky-600 flex items-center justify-center text-xs font-bold text-white">
                    @if(username()) {
                    {{username()?.charAt(0)?.toUpperCase()}}
                    } @else {
                    A
                    }
                </div>
            </div>
        </div>
    </div>
</nav>
